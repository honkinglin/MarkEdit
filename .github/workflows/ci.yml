name: Verify MarkEdit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/react-consumer/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run check:bundle
      - run: npm run example:setup
      - run: npm run example:build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run benchmark
      - run: npm run release:report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            .benchmarks/bundle-ci.json
            .benchmarks/report.json
            .benchmarks/release-report.json
            .benchmarks/third-party-notices.json
            .benchmarks/markedit-react-*.tgz
          if-no-files-found: warn
          retention-days: 14
