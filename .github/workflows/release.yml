name: Publish react-markedit
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check release source
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("packages/editor/package.json")); if (process.env.RELEASE_TAG !== `v${p.version}` || !/^\d+\.\d+\.\d+$/.test(p.version)) process.exit(1);'
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run release:prepare
      - uses: actions/upload-artifact@v4
        with:
          name: npm-candidate
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .benchmarks/react-markedit-*.tgz
            .benchmarks/release-manifest.json
            .benchmarks/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-test-evidence
          path: |
            playwright-report/
            test-results/
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-candidate
          path: .benchmarks
      - run: node scripts/publish-artifact.mjs
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: npm-candidate
          path: .benchmarks
      - name: Create release
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" --verify-tag --title "react-markedit $VERSION" --notes-file "releases/$VERSION.md" .benchmarks/react-markedit-*.tgz .benchmarks/SHA256SUMS
